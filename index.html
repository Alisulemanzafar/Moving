<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fleet-X Smooth Scroll Truck Hero</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="truck-scroll-section" id="truckSection">
  <div class="truck-hero">
    <canvas id="truckCanvas" aria-label="Fleet-X trucks moving on the road"></canvas>
    <div class="shade"></div>
    <div class="hero-content" id="heroContent">
      <div class="eyebrow">FLEET-X LOGISTICS</div>
      <h1>KEEPING<br>FREIGHT <span>MOVING.</span></h1>
      <p>Reliable transportation solutions built to keep your freight moving across every mile.</p>
      <a href="#services">Explore Our Services →</a>
    </div>
    <div class="loading" id="loading"><b id="loadPercent">0%</b><span>Preparing smooth drive</span></div>
    <div class="scroll-indicator" id="scrollHint">SCROLL TO DRIVE<div class="scroll-line"></div></div>
  </div>
</section>
<section class="next-section" id="services"><div><h2>Logistics Without Limits.</h2><p>Flatbed · Reefer · Dry Van · Hotshot · Step Deck · Power Only</p></div></section>
<script src="script.js"></script>
</body>
</html>
